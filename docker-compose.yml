version: '3.9'

services:

  wordpress:
    image: wordpress:php8.1-apache
    restart: always
    ports:
      - 8080:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: secret
      WORDPRESS_DB_NAME: db_robingather
    volumes:
      - ./bruh:/var/www/html

  db:
    image: mysql:latest
    restart: always
    ports:
      - 9921:3306
    environment:
      MYSQL_DATABASE: db_robingather
      MYSQL_USER: wp
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret2
    volumes:
      - ./data2:/var/lib/mysql

